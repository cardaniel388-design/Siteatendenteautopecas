<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autopeças é para você: descubra seu caminho como atendente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#141414;--ink:#fff;--muted:#b3b3b3;--line:#2e2e2e;--red:#e10600;--red2:#ff3b30;--soft:#1f1f1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding:26px 20px 40px;text-align:center}
.logo{margin-bottom:22px;padding-bottom:12px;border-bottom:3px solid var(--red)}
.logo img{display:block;height:46px;width:auto;margin:0 auto}
.hero-logo{display:block;width:100%;max-width:340px;height:auto;margin:4px auto 14px}
.eyebrow{color:var(--red2);font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:18px 0 10px}
h1,h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.005em}
h1{font-size:clamp(38px,11vw,52px);line-height:1;margin:0 0 16px}
h2{font-size:clamp(30px,8.5vw,38px);line-height:1.05;margin:24px 0 22px}
p.sub{color:var(--muted);font-size:17px;margin:0 0 24px}
.covers{display:flex;justify-content:center;margin:6px 0 26px}
.cv{width:66px;height:92px;border-radius:3px 6px 6px 3px;background:#0d0d0d;border:1px solid #333;border-left:5px solid var(--red);color:#fff;font:800 11px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;padding:10px 6px 0 7px;text-align:left;margin-left:-12px;box-shadow:0 6px 14px rgba(0,0,0,.7);position:relative}
.cv::before{content:"";display:block;width:16px;height:3px;background:var(--red);margin-bottom:7px}
.cv::after{content:"Autopeças";position:absolute;left:7px;bottom:7px;font:700 7px 'Barlow Condensed',sans-serif;letter-spacing:.1em;color:var(--red2)}
.cv.b{background:var(--red);border-color:var(--red);border-left-color:#fff}
.cv.b::before{background:#fff}.cv.b::after{color:#fff}
.cv:first-child{margin-left:0}
.cv:nth-child(1){transform:rotate(-8deg)}.cv:nth-child(2){transform:rotate(-4deg)}.cv:nth-child(3){transform:translateY(-6px)}.cv:nth-child(4){transform:rotate(4deg)}.cv:nth-child(5){transform:rotate(8deg)}
.shot{margin:22px -20px 10px}
.shot img{display:block;width:100%;height:auto;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.covers.front{position:relative;z-index:2;margin:-50px 0 24px}
.front .cv{width:78px;height:110px;font-size:13px;padding-top:12px}
.front .cv::after{font-size:8px;bottom:9px}
.rh{font-size:clamp(28px,8vw,36px);margin-bottom:12px}
.why.sm{font-size:14.5px;line-height:1.4;padding:12px 14px}
.why.sm p{margin:0 0 6px}
.btn{display:block;width:100%;background:var(--red);color:#fff;font:800 22px 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:17px 16px;border:0;border-radius:10px;text-decoration:none;cursor:pointer;box-shadow:0 8px 24px rgba(225,6,0,.45)}
.btn:active{background:#b80500}
.btn:focus-visible,.opt:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tiny{font-size:14px;color:var(--muted);margin:14px 0 0}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .35s ease}
.step{color:var(--muted);font-weight:600;font-size:15px}
.opts{display:grid;gap:12px;text-align:left}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:18px 18px;font:600 18px/1.3 Barlow,sans-serif;color:var(--ink);cursor:pointer;width:100%;text-align:left}
.opt:active{border-color:var(--red);background:var(--soft)}
.opt svg{flex:none;width:22px;height:22px;stroke:var(--red2)}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--soft);border-top-color:var(--red);margin:110px auto 30px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.bar i{transition:none}}
.box{background:var(--card);border:2px solid var(--red);box-shadow:0 0 0 5px rgba(225,6,0,.2);border-radius:16px;padding:24px 22px;text-align:left;margin-top:22px}
.box .lead{font-weight:600;font-size:18px;line-height:1.35;margin:0 0 16px}
.ck{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:12px;font-size:16.5px}
.ck li{display:flex;gap:12px;align-items:flex-start}
.ck li::before{content:"✓";color:var(--red2);font-weight:800;flex:none}
.why{background:var(--soft);border-left:4px solid var(--red);border-radius:10px;padding:16px 18px;text-align:left;font-size:16px;margin:0 0 4px}
.why b{color:var(--red2)}
.why p{margin:0 0 8px}.why p:last-child{margin:0}
.pt{text-align:center}
.pt .n{font:800 22px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0}
.pt .p{font:800 clamp(60px,17vw,78px)/1 'Barlow Condensed',sans-serif;color:var(--red2);margin:2px 0 0}
.pt .m{font-weight:600;color:var(--muted);font-size:15px;margin:0 0 18px}
.urg{font-weight:600;font-size:15px;margin:16px 0 0;text-align:center}
.disc{font-size:12.5px;color:var(--muted);margin:26px 4px 0;line-height:1.5}

.plan{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px 20px 22px;text-align:left;margin-top:18px;position:relative}
.plan.hl{border-color:var(--red);box-shadow:0 0 0 5px rgba(225,6,0,.2)}
.plan .tag{position:absolute;top:-13px;left:18px;background:var(--red);color:#fff;font:800 14px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:6px}
.pn{font:800 24px/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0}
.pp{font:800 54px/1 'Barlow Condensed',sans-serif;color:var(--red2);margin:6px 0 0}
.plan .m{font-weight:600;color:var(--muted);font-size:14.5px;margin:0 0 16px}
.old{color:var(--muted);text-decoration:line-through;margin:8px 0 0;font-weight:600}
.old + .pp{margin-top:0}
.no{display:block;text-align:center;color:var(--muted);font-size:15px;text-decoration:underline;margin-top:16px;padding:8px}
.no:focus-visible{outline:3px solid #fff;outline-offset:3px}
.wa{background:#0b141a;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:14px 0;text-align:left}
.wa-h{display:flex;align-items:center;gap:10px;background:#202c33;padding:10px 14px}
.wa-h i{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font:800 16px/34px 'Barlow Condensed',sans-serif;text-align:center;font-style:normal;flex:none}
.wa-h b{display:block;font:600 15px/1.2 Barlow,sans-serif}.wa-h small{color:#8696a0;font-size:12px}
.wa-b{padding:12px 12px 6px;display:grid;gap:6px}
.wa-b img{width:100%;height:auto;border-radius:8px;display:block}
.m{max-width:85%;padding:7px 10px 4px;border-radius:8px;font:500 15px/1.35 Barlow,sans-serif;color:#e9edef;background:#202c33}
.m.me{justify-self:end;background:#005c4b}
.m span{display:block;text-align:right;font-size:11px;color:#8696a0;margin-top:2px}
.m.me span::after{content:" ✓✓";color:#53bdeb}
.fq{background:var(--card);border:2px solid var(--line);border-radius:12px;margin-bottom:10px;text-align:left}
.fq summary{list-style:none;cursor:pointer;padding:16px 18px;font:600 17px/1.3 Barlow,sans-serif;display:flex;justify-content:space-between;gap:12px;align-items:center}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";color:var(--red2);font:800 26px/1 'Barlow Condensed',sans-serif;flex:none}
.fq[open]{border-color:var(--red)}.fq[open] summary::after{content:"\2013"}
.fq summary:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:10px}
.fq p{margin:0;padding:0 18px 16px;color:var(--muted);font-size:16px}
.sec{margin:34px 0 4px}
.banner{margin:0 -20px 10px}.banner img{display:block;width:100%;height:auto}
</style>
</head>

function show(h,big){ app.innerHTML = (big ? '<div class="logo"><img src="'+LOGO2_SRC+'" alt="Autopeças é para você"></div>' : LOGO) + h; window.scrollTo(0,0); }
function intro(){
  show('<div class="banner"><img src="'+BANNER_SRC+'" alt="Autopeças é para você: quiz, guia e garantia de 7 dias"></div>'+
    '<div class="eyebrow">Para quem quer trabalhar em autopeças</div>'+
    '<h1>Descubra seu caminho como atendente</h1>'+
    '<p class="sub">Responda 5 perguntas rápidas e descubra por onde começar para trabalhar como atendente, mesmo sem experiência.</p>'+
    '<button class="btn" data-start>Quero meu plano &rarr;</button>'+
    '<p class="tiny">Leva menos de 1 minuto. Sem cadastro.</p>', true);
}
function ask(i){
  var q = Q[i];
  var o = q.o.map(function(x){return '<button class="opt" data-k="'+x[1]+'"><span>'+x[0]+'</span>'+ARROW+'</button>';}).join('');
  show('<div class="bar" role="progressbar" aria-valuemin="1" aria-valuemax="5" aria-valuenow="'+(i+1)+'"><i style="width:'+(i*20)+'%"></i></div>'+
    '<div class="step">Pergunta '+(i+1)+' de 5</div><h2>'+q.t+'</h2><div class="opts">'+o+'</div>');
  requestAnimationFrame(function(){var f=app.querySelector('.bar i'); if(f) f.style.width=((i+1)*20)+'%';});
}
function loading(){
  show('<div class="spin" role="status" aria-label="Carregando"></div><h2 style="margin:0 0 8px">Analisando suas respostas...</h2><p class="sub">Montando o seu plano de atendente</p>');
  setTimeout(result, 2600);
}
function link(u){
  var q = location.search;

  {name:'Nome do aluno 2', msgs:[['them','[Cole aqui o depoimento real do aluno]','14:12']]},
  {name:'Nome do aluno 3', msgs:[['them','[Cole aqui o depoimento real do aluno]','20:05']]}
];
var FAQ = [
  ['Preciso ter experiência ou entender de carros?','Não. O guia parte do zero: começa pelos sistemas do carro e pelas peças de cada um, e segue até o atendimento no balcão.'],

  ['O pagamento é mensal?','Não. Nos dois planos o pagamento é único.'],
  ['Qual a diferença entre o Essencial e o Completo?','O Essencial traz o guia completo do zero ao atendimento de balcão. O Completo inclui o guia e o Grande Bônus: roteiros de atendimento, checklist de compatibilidade, dicionário de peças e kit de currículo e entrevista.'],

];
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function wa(){
  return TESTIMONIALS.map(function(t){
    var b = t.img ? '<img src="'+t.img+'" alt="Print de depoimento">' :
      t.msgs.map(function(m){return '<div class="m'+(m[0]==='me'?' me':'')+'">'+esc(m[1])+'<span>'+esc(m[2]||'')+'</span></div>';}).join('');
    return '<div class="wa"><div class="wa-h"><i>'+esc(t.name.charAt(0))+'</i><div><b>'+esc(t.name)+'</b><small>online</small></div></div><div class="wa-b">'+b+'</div></div>';
  }).join('');
}
function faq(){
  return FAQ.map(function(f){return '<details class="fq"><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>';}).join('');
}
function mock(){
  return '<div class="shot" aria-hidden="true"><img src="'+MOCK_SRC+'" alt=""></div>';
}
function result(){
  var p = PATH[ans[4]] || PATH.loja;
  show('<div class="eyebrow">Seu resultado</div><h1 class="rh">Seu plano de atendente está pronto</h1>'+
    '<div class="why sm"><p>Pelas suas respostas, seu melhor ponto de partida é <b>'+p.t+'</b>.</p><p>'+p.d+'</p><p>'+(KNOW[ans[1]]||'')+'</p><p>'+(TIME[ans[2]]||'')+'</p><p>'+(BLOCK[ans[3]]||'')+'</p></div>'+
    mock()+
    '<h2 style="margin:10px 0 4px">Escolha como quer começar</h2>'+
    '<div class="plan"><p class="pn">Guia Essencial</p><p class="pp">R$ 19,90</p><p class="m">Pagamento único &bull; Acesso imediato</p>'+
    '<ul class="ck"><li>Guia completo do zero ao atendimento de balcão</li><li>Sistemas do carro e peças de cada um</li><li>Como identificar a peça e confirmar compatibilidade</li><li>Atendimento no balcão e no WhatsApp</li></ul>'+
    '<button class="btn" data-plan="19">Quero o Essencial &rarr;</button></div>'+
    '<div class="plan hl"><span class="tag">Mais completo</span><p class="pn">Guia Completo + Grande Bônus</p><p class="pp">R$ 37,90</p><p class="m">Pagamento único &bull; Acesso imediato</p>'+
    '<ul class="ck"><li>Tudo do Guia Essencial</li><li><b>Grande Bônus:</b> pack de roteiros de atendimento para balcão e WhatsApp</li><li><b>Grande Bônus:</b> checklist de compatibilidade de peças</li><li><b>Grande Bônus:</b> dicionário de peças para consulta rápida</li><li><b>Grande Bônus:</b> kit de currículo e entrevista</li></ul>'+
    '<a class="btn" href="'+link(CONFIG.c37)+'">Quero o Completo &rarr;</a></div>'+
    '<div class="sec"><h2 style="margin:0 0 14px">Perguntas frequentes</h2></div>'+faq()+'<p class="urg">Garantia de 7 dias: se não fizer sentido, você pede o reembolso.</p>'+
    '<p class="disc">Conteúdo educativo da Editora Digital. Não garante emprego nem remuneração; o resultado depende da sua dedicação e do mercado da sua região.</p>');
}
function upsell(){
  show('<div class="eyebrow">Antes de continuar</div><h1>Leve o bônus por apenas R$ 4,00 a mais</h1>'+
    '<p class="sub">Você escolheu o Guia Essencial. Que tal levar também o bônus com os roteiros de atendimento?</p>'+
    mock()+
    '<div class="plan hl"><span class="tag">Oferta com bônus</span><p class="pn">Guia Essencial + Bônus</p>'+
    '<p class="old">de R$ 19,90</p><p class="pp">R$ 23,90</p><p class="m">Pagamento único &bull; Acesso imediato</p>'+

    '<a class="no" href="'+link(CONFIG.c19)+'">Não, obrigado. Quero só o guia por R$ 19,90</a></div>');
}
app.addEventListener('click', function(e){
  if(e.target.closest('[data-start]')){ ans=[]; ask(0); return; }
  if(e.target.closest('[data-plan]')){ upsell(); return; }
  var b = e.target.closest('[data-k]');
  if(!b) return;
  ans.push(b.getAttribute('data-k'));
  if(ans.length < Q.length) ask(ans.length); else loading();
});
